name: Build and Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release.yml'
      - 'Native/**'
      - 'SonicRoute*/**'
      - 'SonicRoute.Native.slnx'
      - 'StoreInterop/**'
      - 'Directory.Build.*'
      - 'global.json'
      - 'build/**'
      - 'docs/readme/**'
      - 'docs/release-*.md'
      - 'packaging/**'
      - 'shared/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (validate, build and verify locally without publishing to GitHub)'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && 'release-publishing' || 'release-validation' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: powershell

jobs:
  validate:
    name: Build and validate candidate (read only)
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.upload_candidate.outputs.artifact-digest }}

    steps:
      - name: Select isolated candidate output
        id: candidate
        run: |
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "CANDIDATE_DIRECTORY=$env:RUNNER_TEMP/sonicroute-candidate`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "artifact_name=sonicroute-release-candidate-${{ github.run_attempt }}`n", $utf8)
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize checkout-local build exclusions
        run: .\packaging\Updates\Initialize-ReleaseCheckout.ps1

      - name: Check release policy before building
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
        run: |
          .\packaging\Updates\Invoke-ReleasePipeline.ps1 -Stage Preflight -Repo $env:TARGET_REPOSITORY -DryRun:($env:DRY_RUN -eq 'true')

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify README consistency
        run: node docs/readme/generate.cjs --check

      - name: Build Native AOT Full and Lite for x64 and ARM64, plus Legacy x64
        run: |
          $ErrorActionPreference = 'Stop'
          .\packaging\Updates\Build-PortableRelease.ps1 -OutputDirectory $env:CANDIDATE_DIRECTORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate configuration and localization contracts
        run: dotnet run --project packaging/Tests/SerializationChecks/Checks.csproj -c Release -f net10.0-windows

      - name: Test actual release functions against candidate bytes
        run: |
          .\packaging\Updates\Test-ReleasePipelineHarness.ps1 -AssetsDirectory "$env:CANDIDATE_DIRECTORY/assets" -ReportPath "$env:CANDIDATE_DIRECTORY/harness-results.json"

      - name: Verify client runtime isolation and actual package staging
        run: |
          foreach ($tfm in @('net10.0-windows', 'net48')) {
            dotnet run --project packaging/Updates/tests/RuntimeChecks/Checks.csproj -c Release -f $tfm -p:SonicRouteEdition=Lite -- "$env:CANDIDATE_DIRECTORY/assets" "$env:RUNNER_TEMP/client-validation/$tfm"
            if ($LASTEXITCODE -ne 0) { throw "Client validation failed: $tfm" }
          }

      - name: Verify actual worker processes and rollback
        run: |
          .\packaging\Updates\tests\Run-WorkerChecks.ps1 -AssetsDirectory "$env:CANDIDATE_DIRECTORY/assets" -OutputDirectory "$env:RUNNER_TEMP/worker-validation"

      - name: Verify restart, update and rollback in the Native AOT x64 executables
        shell: pwsh
        run: |
          $version = [string]([xml](Get-Content build/Version.props -Raw)).Project.PropertyGroup.SonicRouteVersion
          ./Native/ProductChecks/Test-ProductUpdate.ps1 -Edition Full -ProductExe "$env:CANDIDATE_DIRECTORY/assets/SonicRoute-v$version-x64.exe" -EvidenceDirectory "$env:RUNNER_TEMP/native-validation/Full-x64"
          ./Native/ProductChecks/Test-ProductUpdate.ps1 -Edition Lite -ProductExe "$env:CANDIDATE_DIRECTORY/assets/SonicRoute-v$version-Lite-x64.exe" -EvidenceDirectory "$env:RUNNER_TEMP/native-validation/Lite-x64"

      - name: Build the unsigned Full x64 Microsoft Store candidate
        run: |
          .\packaging\Store\Build-Package.ps1 -Edition Full -PublishDirectory "$env:CANDIDATE_DIRECTORY/full-net10.0-windows-x64" -OutputDirectory "$env:RUNNER_TEMP/sonicroute-store"

      - name: Full dry run without write credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\packaging\Updates\Invoke-ReleasePipeline.ps1 -Repo $env:TARGET_REPOSITORY -OutputDirectory $env:CANDIDATE_DIRECTORY -SkipBuild -DryRun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve validated candidate and receipt
        id: upload_candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          retention-days: 14
          path: |
            ${{ env.CANDIDATE_DIRECTORY }}/assets/*
            ${{ env.CANDIDATE_DIRECTORY }}/build-receipt.json
            ${{ env.CANDIDATE_DIRECTORY }}/CHANGELOG.md
            ${{ env.CANDIDATE_DIRECTORY }}/harness-results.json
          if-no-files-found: error

      - name: Download candidate into a separate directory
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.upload_candidate.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.upload_candidate.outputs.artifact-digest }}
          CANDIDATE_DOWNLOAD_DIRECTORY: ${{ runner.temp }}/candidate-roundtrip
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or $env:CANDIDATE_ARTIFACT_DIGEST -notmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid candidate artifact ID or SHA-256 digest.' }
          $archive = Join-Path $env:RUNNER_TEMP ('release-candidate-' + $env:CANDIDATE_ARTIFACT_ID + '.zip')
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CANDIDATE_ARTIFACT_ID/zip"
          if (Test-Path -LiteralPath $env:CANDIDATE_DOWNLOAD_DIRECTORY) { throw 'Candidate download directory must be new.' }
          $downloaded = $false
          try {
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
              # Download the immutable ID via REST, bypassing the artifact name lookup.
              & curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 40 --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/vnd.github+json' --output $archive $uri
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0 -and (Test-Path -LiteralPath $archive -PathType Leaf)) { $downloaded = $true; break }
              if ($attempt -lt 6) {
                $delay = [int][Math]::Pow(2, $attempt)
                Write-Warning "Artifact download attempt $attempt failed (curl exit $exitCode); retrying in $delay seconds."
                Start-Sleep -Seconds $delay
              }
            }
            if (-not $downloaded) { throw 'Candidate artifact download failed after six attempts.' }
            $actualDigest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
            if ($actualDigest -ne $env:CANDIDATE_ARTIFACT_DIGEST) { throw 'Candidate artifact archive SHA-256 mismatch.' }
            Expand-Archive -LiteralPath $archive -DestinationPath $env:CANDIDATE_DOWNLOAD_DIRECTORY
            Write-Host "Verified candidate artifact $env:CANDIDATE_ARTIFACT_ID (SHA-256 $actualDigest)."
          } finally {
            if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          }
          # The original release pipeline revalidates the extracted receipt and asset bytes.

      - name: Revalidate downloaded candidate without write credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          .\packaging\Updates\Invoke-ReleasePipeline.ps1 -Stage Publish -DryRun -Repo $env:TARGET_REPOSITORY -OutputDirectory "$env:RUNNER_TEMP/candidate-roundtrip"

      - name: Preserve unsigned Store candidate separately from the portable release
        uses: actions/upload-artifact@v7
        with:
          name: sonicroute-store-full-x64-unsigned-${{ github.run_attempt }}
          retention-days: 14
          path: ${{ runner.temp }}/sonicroute-store/*-unsigned.msix
          if-no-files-found: error

      - name: Retain validation failures for diagnosis
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sonicroute-validation-failure-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ env.CANDIDATE_DIRECTORY }}/assets/*
            ${{ env.CANDIDATE_DIRECTORY }}/build-receipt.json
            ${{ env.CANDIDATE_DIRECTORY }}/CHANGELOG.md
            ${{ env.CANDIDATE_DIRECTORY }}/harness-results.json
            ${{ runner.temp }}/candidate-roundtrip/**
            ${{ runner.temp }}/client-validation/**/result.json
            ${{ runner.temp }}/client-validation/**/failure.txt
            ${{ runner.temp }}/worker-validation/**/results.json
            ${{ runner.temp }}/native-validation/**/receipt.json
            ${{ runner.temp }}/native-validation/**/last-result.json
            ${{ runner.temp }}/sonicroute-store/*.log
          if-no-files-found: warn

  publish:
    name: Publish exact validated candidate
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref == 'refs/heads/master' }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize checkout-local build exclusions
        run: .\packaging\Updates\Initialize-ReleaseCheckout.ps1
      - name: Download exact validated candidate by ID
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.validate.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.validate.outputs.candidate_artifact_digest }}
          CANDIDATE_DOWNLOAD_DIRECTORY: ${{ runner.temp }}/sonicroute-candidate
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or $env:CANDIDATE_ARTIFACT_DIGEST -notmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid candidate artifact ID or SHA-256 digest.' }
          $archive = Join-Path $env:RUNNER_TEMP ('release-candidate-' + $env:CANDIDATE_ARTIFACT_ID + '.zip')
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CANDIDATE_ARTIFACT_ID/zip"
          if (Test-Path -LiteralPath $env:CANDIDATE_DOWNLOAD_DIRECTORY) { throw 'Candidate download directory must be new.' }
          $downloaded = $false
          try {
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
              # Download the immutable ID via REST, bypassing the artifact name lookup.
              & curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 40 --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/vnd.github+json' --output $archive $uri
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0 -and (Test-Path -LiteralPath $archive -PathType Leaf)) { $downloaded = $true; break }
              if ($attempt -lt 6) {
                $delay = [int][Math]::Pow(2, $attempt)
                Write-Warning "Artifact download attempt $attempt failed (curl exit $exitCode); retrying in $delay seconds."
                Start-Sleep -Seconds $delay
              }
            }
            if (-not $downloaded) { throw 'Candidate artifact download failed after six attempts.' }
            $actualDigest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
            if ($actualDigest -ne $env:CANDIDATE_ARTIFACT_DIGEST) { throw 'Candidate artifact archive SHA-256 mismatch.' }
            Expand-Archive -LiteralPath $archive -DestinationPath $env:CANDIDATE_DOWNLOAD_DIRECTORY
            Write-Host "Verified candidate artifact $env:CANDIDATE_ARTIFACT_ID (SHA-256 $actualDigest)."
          } finally {
            if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          }
          # The original release pipeline revalidates the extracted receipt and asset bytes.
      - name: Revalidate source, receipt, bytes and remote state before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          .\packaging\Updates\Invoke-ReleasePipeline.ps1 -Stage Publish -Repo $env:TARGET_REPOSITORY -OutputDirectory "$env:RUNNER_TEMP/sonicroute-candidate"
