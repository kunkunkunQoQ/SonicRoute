name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (validate, build and verify locally without publishing to GitHub)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-publishing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, Verify and Publish Release
    runs-on: windows-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify README consistency
        run: node docs/readme/generate.cjs --check

      - name: Run release pipeline test harness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\packaging\Updates\Test-ReleasePipelineHarness.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify solution build
        run: dotnet build SonicRoute.sln -c Release

      - name: Run automated release pipeline
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOLUTION_BUILD_VERIFIED: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $isDryRun = ('${{ inputs.dry_run }}' -eq 'true')
          .\packaging\Updates\Invoke-ReleasePipeline.ps1 -Repo "${{ github.repository }}" -DryRun:$isDryRun -SolutionBuildVerified
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
