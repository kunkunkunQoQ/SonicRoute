name: 💡 功能建议 / Feature Request
description: 对 SonicRoute 有新的功能想法、交互优化或自动化需求？ / Suggest a new feature, workflow enhancement, or automation action
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ### 感谢分享你的构想！/ Thank you for sharing your idea!
        如果是开放式的构想或讨论，也欢迎先在 [Discussions · Ideas](https://github.com/kunkunkunQoQ/SonicRoute/discussions/categories/ideas) 交流。

  - type: dropdown
    id: module
    attributes:
      label: 涉及的功能模块 / Target Area
      description: 该建议主要属于哪一部分 / Which component does this relate to?
      options:
        - 自动化规则与编排引擎 / Automation Rules & Actions
        - 应用音频分流与输出管理 / Per-App Output Routing
        - 录音设备与麦克风控制 / Input Devices & Microphone Mute
        - 快速面板与桌面交互 / Quick Panel & UI/UX
        - 托盘滚轮盲操 / System Tray & Wheel Controls
        - 命令行与 IPC 联动 / CLI (sr) & Named Pipe IPC
        - 全局快捷键 / Global Hotkeys & Mouse Buttons
        - 屏幕浮动提示 / On-Screen Display (OSD)
        - Android 手机音频、镜像与虚拟屏 / Android Phone Integration & Virtual Display
        - 硬件兼容与虚拟声卡 / Hardware & Virtual Audio Compatibility
        - 国际化与多语言本地化 / Localization & Translations
        - 其他周边联动 / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用痛点与场景 / Problem & Use Case
      description: 请描述在什么场景下现有功能无法满足需求 / What problem does this solve, and in what daily scenario?
      placeholder: "e.g., I want an automation trigger or action to smooth-fade music when entering a voice call..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案与交互 / Proposed Solution
      description: 希望它以什么形式出现、如何配置与操作？ / How should this look, be configured, and behave?
      placeholder: "Describe the ideal UI option, hotkey, or automation step..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或现有变通方式（可选）/ Alternatives Considered (Optional)
      description: 目前你是如何绕过或变通解决该问题的？ / Any scripts, tools, or workarounds you currently use?
      placeholder: "e.g., Currently using an AutoHotkey script + sr CLI..."
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: 重要程度 / Impact Level
      description: 该功能对日常使用的重要性 / How impactful would this improvement be for you?
      options:
        - ⭐⭐⭐ 强烈推荐：核心场景痛点 / High — solves a core daily pain point
        - ⭐⭐ 体验提升：让操作更顺畅 / Medium — smoother daily workflow
        - ⭐ 锦上添花：细节微调或极客玩法 / Low — nice-to-have polish or power-user tweak
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交确认 / Checklist
      description: 提交前请确认 / Please confirm before submitting
      options:
        - label: 我已确认当前版本与 README / Wiki 中尚无此原生功能 / I checked existing features in README and confirmed this is not yet supported
          required: true
        - label: 我理解 SonicRoute 优先采用事件驱动与低闲时开销设计 / I understand SonicRoute favors event-driven, low-idle-CPU designs
          required: true
