name: 🎧 音频设备兼容性反馈 / Device Compatibility
description: 分享耳机、USB DAC、蓝牙或虚拟声卡在 SonicRoute 下的表现与经验 / Report compatibility & tips for headsets, DACs, Bluetooth, or virtual drivers
title: "[Device]: "
labels: [device-compat]
body:
  - type: markdown
    attributes:
      value: |
        ### 感谢参与硬件兼容性反馈！/ Thank you for sharing hardware compatibility reports!
        无论「完美兼容」还是遇到特定驱动问题，你的实测反馈都能帮助更多用户顺利配置设备。

  - type: input
    id: device_model
    attributes:
      label: 音频设备 / 驱动名称与型号 / Device or Driver Model
      description: 请尽可能注明品牌、型号与驱动 / Brand, model, and driver name if applicable
      placeholder: "e.g., FiiO K7 (USB DAC) / Sony WH-1000XM5 (LDAC) / Voicemeeter Banana"
    validations:
      required: true

  - type: dropdown
    id: connection_type
    attributes:
      label: 连接方式 / Connection Type
      description: 设备如何连接到电脑 / How does the device connect to Windows?
      options:
        - USB 外置声卡 / USB DAC & Amp
        - 蓝牙无线音频 / Bluetooth Audio (A2DP / HFP)
        - 3.5mm / 6.35mm 模拟音频接口 / Analog Jack (Realtek / Onboard)
        - HDMI / DisplayPort 显示器音频 / Monitor Audio
        - 虚拟声卡驱动 / Virtual Driver (Voicemeeter, SteelSeries Sonar, Wave Link, etc.)
        - USB-C 便携解码线 / USB-C Dongle DAC
        - 其他接口 / Other (Thunderbolt, PCIe, Optical)
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: 兼容性结论 / Compatibility Result
      description: 整体使用表现 / Overall compatibility status
      options:
        - 🟢 完美兼容：分流、默认切换、滑块与热插拔均正常 / Works great out of the box
        - 🟡 基本可用：偶有小问题（如唤醒后需重切或步进略差）/ Mostly works with minor quirks
        - 🟠 需特殊设置：需在 Windows 声音属性关闭独占模式等 / Works with configuration tweaks
        - 🔴 严重问题：无法分流、爆音/无声或报错 / Major issues or broken routing
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 系统与 SonicRoute 版本 / OS & SonicRoute Version
      description: 你的运行环境 / Windows & SonicRoute build used
      placeholder: "e.g., Windows 11 24H2 + SonicRoute v1.31 Full x64"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 使用表现与细节 / Observed Behavior & Details
      description: 描述在多采样率、自动化规则或特定应用下的表现 / Behavior across sample rates, automation rules, or specific apps
      placeholder: "Describe routing reliability, switching speed, audio glitches, etc..."
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 调校心得或解决方法（可选）/ Settings or Workarounds (Optional)
      description: 若有有效配置技巧欢迎分享 / Any Windows audio settings or driver tweaks that helped?
      placeholder: "e.g., Disabling 'Allow applications to take exclusive control of this device' resolved the lock..."
    validations:
      required: false
