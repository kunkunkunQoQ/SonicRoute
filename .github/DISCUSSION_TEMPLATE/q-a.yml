title: "[Q&A / 咨询]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        ### 💬 欢迎咨询 SonicRoute 使用、配置与搭配方案！/ Ask Questions About Usage & Setup!

        > [!IMPORTANT]
        > **如果遇到软件崩溃、路由故障或异常报错 / Encountered a bug, crash, or broken route?**
        > 请优先前往 **[GitHub Issues 提交 Bug 反馈](https://github.com/kunkunkunQoQ/SonicRoute/issues/new?template=bug_report.yml)**。 / Please file a **[Bug Report in Issues](https://github.com/kunkunkunQoQ/SonicRoute/issues/new?template=bug_report.yml)** so it is tracked properly.
        >
        > - 📖 **Wiki（简体中文）**：[使用指南](https://github.com/kunkunkunQoQ/SonicRoute/wiki/01-%E4%BD%BF%E7%94%A8%E6%8C%87%E5%8D%97) · [快捷键](https://github.com/kunkunkunQoQ/SonicRoute/wiki/03-%E5%BF%AB%E6%8D%B7%E9%94%AE) · [自动化规则](https://github.com/kunkunkunQoQ/SonicRoute/wiki/04-%E8%87%AA%E5%8A%A8%E5%8C%96%E8%A7%84%E5%88%99) · [常见问题](https://github.com/kunkunkunQoQ/SonicRoute/wiki/06-%E5%B8%B8%E8%A7%81%E9%97%AE%E9%A2%98)
        > - 🤖 **AI / English Reference**：[README.en.md](https://github.com/kunkunkunQoQ/SonicRoute/blob/master/README.en.md) · [README.ai.md](https://github.com/kunkunkunQoQ/SonicRoute/blob/master/README.ai.md)

  - type: checkboxes
    id: confirm_not_bug
    attributes:
      label: 提问前确认 / Before Asking
      options:
        - label: 我确认本帖属于使用咨询或配置交流（软件故障将优先提交至 Issues）/ I confirm this is a usage question (bugs go to Issues)
          required: true

  - type: dropdown
    id: category
    attributes:
      label: 咨询类别 / Category
      description: 问题主要涉及哪个功能 / Which feature does your question relate to?
      options:
        - 🎧 应用声音分流与设备路由 / Per-App Audio Routing
        - 🎚️ 快速面板与音量控制 / Quick Panel & Volume Controls
        - 🖱️ 托盘滚轮盲操 / System Tray & Wheel Controls
        - ⌨️ 全局快捷键与鼠标侧键 / Hotkeys & Input Hooks
        - 🤖 自动化规则编排 / Automation Rules
        - 💻 命令行 sr 与脚本联动 / CLI (sr) & Scripts
        - 📱 Android 手机音频、镜像与虚拟屏 / Android Audio, Mirroring & Virtual Display
        - ⚙️ 安装选型、运行库与自启 / Editions, .NET Runtime & Startup
        - 💬 其他使用疑问 / Other
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: 所用版本形态 / SonicRoute Edition
      description: 请选择正在使用的版本 / Which edition are you using?
      options:
        - Full x64 (.NET 10, 含手机功能 / With Android integration)
        - Lite x64 (.NET 10, 仅电脑音频 / PC audio only)
        - Legacy x64 (.NET Framework 4.8, 免运行库版)
        - Full ARM64 (.NET 10, 实验性 / Experimental)
        - Lite ARM64 (.NET 10, 实验性 / Experimental)
        - Microsoft Store (Full)
        - 历史 Lite NET8 (.NET 8, 已停更 / Discontinued)
        - 自行编译构建 / Built from source
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: 一句话问题概括 / Question Summary
      description: 简明描述你想了解的问题 / Briefly summarize your question
      placeholder: "e.g., How do I auto-route a game to headphones while lowering music volume on launch?"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 系统与设备环境（可选）/ OS & Audio Setup (Optional)
      description: Windows 版本、SonicRoute 版本及耳机/音箱型号 / Windows version, SonicRoute version, and audio devices
      placeholder: "e.g., Windows 11 24H2 + SonicRoute v1.31 Full x64 + USB headset + speakers"
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: 详细背景与期望效果 / Details & Goal
      description: 说明你的当前设置与期望达成的结果 / What are you trying to achieve and where are you stuck?
      placeholder: "Describe your current workflow and expected result..."
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 已尝试的设置或排查（可选）/ What You Already Tried (Optional)
      description: 例如是否已在「保留的设备 / Kept devices」勾选设备，或在快速面板试过手动切换 / e.g., checked devices in Settings → Kept devices?
      placeholder: "e.g., Checked headphones and speakers in Settings → Kept devices; hotkeys show OSD..."
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: 相关截图或规则（可选）/ Screenshots or Rule Config (Optional)
      description: 粘贴快速面板、规则设置或 Windows 声音界面截图 / Attach Quick Panel or rule screenshots if helpful
    validations:
      required: false
