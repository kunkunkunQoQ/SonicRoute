title: "[Showcase / 分享]: "
labels:
  - showcase
body:
  - type: markdown
    attributes:
      value: |
        ### 🎉 欢迎分享你的音频路由方案与自动化配方！/ Share Your Setup & Automation Recipes!
        无论是双设备接力、游戏语音隔离、OBS 分轨录屏，还是手机与电脑协同玩法，都欢迎分享！

  - type: input
    id: recipe_name
    attributes:
      label: 方案 / 配方名称 / Setup or Recipe Name
      description: 给你的调校方案起个名字 / Give your setup or rule recipe a clear title
      placeholder: "e.g., Zero-friction gaming + music separation with auto-headset switching"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 方案场景 / Scenario Category
      description: 属于哪种典型使用场景 / Which use case fits best?
      options:
        - 🎮 游戏开黑与语音隔离 / Gaming + Voice Chat Separation
        - 💼 居家办公与会议优先 / Work Calls & Background Ducking
        - 🎚️ 多输出设备分控 / Multi-Device Volume Control
        - 🎧 耳机与音箱自动接力 / Auto Switching Between Headset & Speakers
        - 📹 OBS 推流与多轨录屏 / Streaming & Multi-Track Recording
        - 📱 手机音频与虚拟屏协同 / Android Audio & Virtual Display Setup
        - ⚡ 命令行 sr 与外设脚本流 / CLI (sr), AHK & Stream Deck Workflows
    validations:
      required: true

  - type: input
    id: devices
    attributes:
      label: 使用设备与外设 / Devices & Gear Used
      description: 列出方案中涉及的耳机、音箱、声卡或控制器 / List headsets, speakers, DACs, phones, or macro pads
      placeholder: "e.g., Logitech G PRO X + Edifier speakers + Stream Deck"
    validations:
      required: true

  - type: textarea
    id: config_details
    attributes:
      label: 核心配置与规则步骤 / Setup & Automation Steps
      description: 分享触发器与每步动作配置 / Describe triggers, devices, and automation steps
      placeholder: |
        - Trigger: cs2.exe enters foreground
        - Step 1: Switch cs2.exe to Headset at 80%
        - Step 2: Lower music player to 20% on Speakers
        - Step 3: Show OSD confirmation
    validations:
      required: true

  - type: textarea
    id: rules_snippet
    attributes:
      label: 规则片段或 sr 命令行（可选）/ CLI Snippet or Rule Export (Optional)
      description: 可贴出相关命令或 JSON 片段供参考 / Share reusable `sr` commands or rule snippets
      placeholder: |
        ```bash
        sr "Gaming Mode"
        ```
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 效果截图或录屏（可选）/ Screenshots or Clips (Optional)
      description: 贴出快速面板或规则界面截图 / Drop screenshots of your Quick Panel or rule editor
    validations:
      required: false

  - type: textarea
    id: thoughts
    attributes:
      label: 心得与注意事项（可选）/ Tips & Caveats (Optional)
      description: 值得注意的细节与避坑经验 / Any useful tips for others reproducing this setup?
      placeholder: "e.g., Disable audio exclusive mode in Windows sound settings if games lock the endpoint..."
    validations:
      required: false
