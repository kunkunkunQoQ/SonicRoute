title: "[Idea / 灵感]: "
labels:
  - idea
body:
  - type: markdown
    attributes:
      value: |
        ### 💡 欢迎分享创新灵感与玩法构想！/ Share Your Ideas & Workflows!
        在这里自由探讨音频路由、自动化编排、外设联动或桌面交互的更多可能。

        > [!NOTE]
        > **设计原则参考 / Design Philosophy**：SonicRoute 坚持 **事件优先驱动**、**严格控制闲时资源占用**、**免注入/免虚拟声卡驱动** 的轻量原则。 / SonicRoute favors **event-driven detection**, **low idle CPU overhead**, and **zero DLL injection or virtual audio drivers**.

  - type: input
    id: idea_title
    attributes:
      label: 一句话灵感概括 / Idea Summary
      description: 简明总结你的想法 / Briefly summarize your idea
      placeholder: "e.g., Smooth volume ducking for background music when voice chat is active"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及的功能领域 / Related Area
      description: 该灵感主要属于哪一部分 / Which feature area does this relate to?
      options:
        - 🤖 自动化规则与触发器 / Automation & Triggers
        - 🎚️ 快速面板与设备管理 / Quick Panel & Output Volumes
        - 🖱️ 托盘滚轮与手势交互 / Tray Wheel & UI/UX
        - 🎙️ 麦克风控制与全局静音 / Microphone & Mute
        - ⌨️ 全局快捷键与侧键绑定 / Hotkeys & Mouse Hooks
        - 💻 命令行 sr 与外部联动 / CLI, Scripts & Stream Deck
        - 📱 Android 手机音频、镜像与虚拟屏 / Mobile Audio, Mirroring & Virtual Display
        - 🎨 主题视觉与 OSD 浮窗 / Themes & OSD
        - 💡 其他奇思妙想 / Other Ideas
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 使用场景与痛点 / Motivation & Use Case
      description: 该想法能解决什么问题，适合什么场景？ / What problem does it solve, and who benefits?
      placeholder: "Describe the scenario and why existing features aren't enough..."
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 交互流程或实现构想 / Proposed Workflow or Design
      description: 你希望如何配置、触发与呈现？ / How should users configure and trigger it?
      placeholder: "Describe UI controls, trigger conditions, or automation steps..."
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 现有替代方式（可选）/ Current Workarounds (Optional)
      description: 目前是如何临时实现的？ / How do you work around this today?
      placeholder: "e.g., AutoHotkey script calling sr CLI..."
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 参考案例（可选）/ References or Inspiration (Optional)
      description: 是否有其他工具或设计可供参考？ / Any existing apps or UX patterns to reference?
      placeholder: "e.g., Communication ducking in OBS / Discord..."
    validations:
      required: false
